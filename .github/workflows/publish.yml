name: Publish to npm

# Publishes with npm trusted publishing (OIDC): no npm token is stored anywhere.
# Each package's trusted publisher on npmjs.com must name this repository and
# this workflow file (publish.yml).
#
# - beta publishes pre-releases (for example 1.5.4-beta.1) under the "beta" tag.
# - main publishes stable versions (for example 1.5.4) under the "latest" tag.
#
# Trusted publishing covers `npm publish` only, not `npm dist-tag`, so a version
# is never promoted between tags: main publishes its own stable version.

on:
  push:
    branches: [main, beta]

permissions:
  contents: write # push the release tag
  id-token: write # trusted publishing

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never use caching in release builds

      - name: Use npm 11.5.1 or later (required for trusted publishing)
        run: npm install -g npm@^11.5.1

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Decide what to publish
        id: release
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "$NAME@$VERSION is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$VERSION" in
            *-*) PRERELEASE=true ;;
            *) PRERELEASE=false ;;
          esac
          if [ "$GITHUB_REF_NAME" = beta ] && [ "$PRERELEASE" = false ]; then
            echo "::error::beta publishes pre-releases only, such as $VERSION-beta.1. A stable version published from beta could never become latest without npm dist-tag."
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" = main ] && [ "$PRERELEASE" = true ]; then
            echo "::error::main publishes stable versions only; $VERSION is a pre-release."
            exit 1
          fi

          if [ "$GITHUB_REF_NAME" = beta ]; then TAG=beta; else TAG=latest; fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: steps.release.outputs.publish == 'true'
        run: npm publish --access public --tag "${{ steps.release.outputs.tag }}"

      # Tag only after npm accepted the version, so a failed publish can be re-run.
      - name: Tag the release
        if: steps.release.outputs.publish == 'true'
        run: |
          TAG="v${{ steps.release.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; leaving it."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
