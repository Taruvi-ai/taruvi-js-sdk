name: Publish to npm

# Publishes with npm trusted publishing: no npm token is stored anywhere.
# Each package's trusted publisher on npmjs.com names this repository and
# this workflow file (publish.yml).
#
# - beta: pre-release versions (1.5.4-beta.1), npm "beta" tag.
# - main: stable versions (1.5.4), npm "latest" tag. npm itself refuses to
#   publish a pre-release without an explicit tag, so none can reach latest.
# A version that is already on npm is skipped.

on:
  push:
    branches: [main, beta]

permissions:
  contents: write # create the GitHub release and its tag
  id-token: write # npm trusted publishing

concurrency:
  group: publish-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24' # ships npm 11.5.1+, required for trusted publishing
          package-manager-cache: false # never use caching in release builds

      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: JS-DevTools/npm-publish@v4
        id: publish
        with:
          access: public
          tag: ${{ github.ref_name == 'beta' && 'beta' || '' }}

      - uses: softprops/action-gh-release@v3
        if: steps.publish.outputs.type
        with:
          tag_name: v${{ steps.publish.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_name == 'beta' }}
          generate_release_notes: true
